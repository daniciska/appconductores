<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Bolsa de trabajo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#333333}
</style>
</helmet>
<div style="width: 390px; height: 1386px; box-sizing: border-box; background: #F6F6F6; color: #111111; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; flex-direction: column; padding: 56px 20px 0 20px; gap: 16px">
  <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px">
    <h1 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.4px; line-height: 1.2">Bolsa de trabajo</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #6B6B6B; text-wrap: balance">Ofertas abiertas a tu perfil. Postula con un toque.</p>
  </div>

  <div role="tablist" aria-label="Bolsa de trabajo" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #EAEAEA; border-radius: 14px; padding: 4px">
    <button type="button" role="tab" aria-selected="true" style="font: inherit; font-size: 14px; font-weight: 700; min-height: 44px; border: 0; border-radius: 10px; background: #FFFFFF; color: #111111">Ofertas · 5</button>
    <a href="BolsaPostulaciones.dc.html" role="tab" aria-selected="false" style="text-decoration: none; font-size: 14px; font-weight: 600; min-height: 44px; border-radius: 10px; background: transparent; color: #616161; display: flex; align-items: center; justify-content: center">Mis postulaciones · 4</a>
  </div>

  <div role="group" aria-label="Filtrar por negocio" style="display: flex; flex-wrap: wrap; gap: 8px">
    <sc-for list="{{ chips }}" as="c" hint-placeholder-count="3">
      <button type="button" aria-pressed="{{ c.marcado }}" onClick="{{ c.elegir }}" style="font: inherit; font-size: 14px; font-weight: 600; min-height: 44px; padding: 0 16px; border-radius: 22px; border: {{ c.borde }}; background: {{ c.fondo }}; color: {{ c.texto }}">{{ c.nombre }}</button>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{ ofertas }}" as="o" hint-placeholder-count="5">
      <div style="background: #FFFFFF; border: 1px solid {{ o.borde }}; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <sc-if value="{{ o.conMarcas }}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 2px">
              <sc-if value="{{ o.destacada }}" hint-placeholder-val="{{ true }}">
                <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; border-radius: 8px; padding: 5px 9px; background: #FFF6D6; color: #8A5300"><svg width="13" height="13" viewBox="0 0 24 24" fill="#F5B400" stroke="#B88500" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9L12 17.5l-1.9-5.1L5 10.5l5.1-1.9z"></path></svg>Destacada</span>
              </sc-if>
              <sc-if value="{{ o.match }}" hint-placeholder-val="{{ false }}">
                <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; border-radius: 8px; padding: 5px 9px; background: #E3F4EA; color: #145F3B"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#17784A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 12l3 3 7-7"></path><circle cx="12" cy="12" r="9"></circle></svg>Hace match contigo</span>
              </sc-if>
            </div>
          </sc-if>
          <div style="font-size: 17px; font-weight: 700">{{ o.negocio }}</div>
          <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px">
            <div style="font-size: 14px; font-weight: 600; color: #3D3D3D">{{ o.titular }}</div>
            <span style="display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; border-radius: 8px; padding: 5px 9px; background: #E3F4EA; color: #145F3B"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#17784A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Revisado</span>
          </div>
          <div style="font-size: 13px; line-height: 1.4; color: #6B6B6B">{{ o.cond }}</div>
        </div>
        <div style="height: 1px; background: #F0F0F0"></div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
          <sc-if value="{{ o.postulada }}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #145F3B">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#17784A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 3 3 5-6"></path></svg>Postulaste · [dd/mm]</div>
            <a href="BolsaDetalle.dc.html" style="text-decoration: none; min-height: 44px; padding: 0 16px; border-radius: 12px; background: #F0F0F0; color: #111111; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 4px; flex-shrink: 0">Ver<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
          </sc-if>
          <sc-if value="{{ o.abierta }}" hint-placeholder-val="{{ true }}">
            <div style="font-size: 13px; color: #6B6B6B">Publicada hace [N] días</div>
            <a href="BolsaDetalle.dc.html" style="text-decoration: none; min-height: 44px; padding: 0 18px; border-radius: 12px; background: #111111; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 4px; flex-shrink: 0">Ver<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
          </sc-if>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: auto; margin-left: -20px; margin-right: -20px; background: #FFFFFF; border-top: 1px solid #ECECEC; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 0 28px 0">
    <a href="CondInicioActivo.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; font-size: 12px; font-weight: 500; color: #6B6B6B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"></path><path d="M5 10v10h14V10"></path></svg>Inicio</a>
    <a href="CondMatches.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; font-size: 12px; font-weight: 500; color: #6B6B6B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 12l3 3 7-7"></path><circle cx="12" cy="12" r="9"></circle></svg>Matches</a>
    <a href="BolsaLista.dc.html" aria-current="page" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; font-size: 12px; font-weight: 700; color: #111111"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"></path><path d="M3 12.5h18"></path></svg>Bolsa</a>
    <a href="CondMensajes.dc.html" aria-label="Mensajes, 1 nuevo" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; font-size: 12px; font-weight: 500; color: #6B6B6B"><span style="position: relative; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg><span aria-hidden="true" style="position: absolute; top: -2px; right: -4px; width: 8px; height: 8px; border-radius: 6px; background: #F5B400; border: 2px solid #FFFFFF"></span></span>Mensajes</a>
    <a href="CondPerfil.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; font-size: 12px; font-weight: 500; color: #6B6B6B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Perfil</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1386}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { filtro: 'todos' };
}
renderVals() {
const filtro = this.state.filtro;
const chips = [['todos', 'Todos'], ['taxi', 'Taxi'], ['ejecutivo', 'Taxi ejecutivo']].map(([id, nombre]) => {
const sel = filtro === id;
return {
nombre,
marcado: sel ? 'true' : 'false',
fondo: sel ? '#111111' : '#FFFFFF',
texto: sel ? '#FFFFFF' : '#111111',
borde: sel ? '1px solid #111111' : '1px solid #DDDDDD',
elegir: () => this.setState({ filtro: id })
};
});
const base = { titular: '[Nombre del titular o empresa]' };
const todas = [
{ ...base, negocio: 'Taxi', clave: 'taxi', cond: 'Retiro en [comuna] · Noche · Lu a Sá', match: true, postulada: true },
{ ...base, negocio: 'Taxi ejecutivo', clave: 'ejecutivo', cond: 'Retiro en [comuna] · Día · Lu a Vi', destacada: true },
{ ...base, negocio: 'Taxi ejecutivo', clave: 'ejecutivo', cond: 'Retiro en [comuna] · Noche · Todos los días' },
{ ...base, negocio: 'Taxi ejecutivo', clave: 'ejecutivo', cond: 'Retiro en [comuna] · Noche · Lu a Vi', postulada: true },
{ ...base, negocio: 'Taxi', clave: 'taxi', cond: 'Retiro en [comuna] · Día y noche · Todos los días', postulada: true },
];
const ofertas = todas
.map((o, i) => ({ ...o, orden: (o.destacada ? 0 : 1) * 10 + i }))
.sort((a, b) => a.orden - b.orden)
.filter((o) => filtro === 'todos' || o.clave === filtro)
.map((o) => ({
...o,
destacada: !!o.destacada,
match: !!o.match,
postulada: !!o.postulada,
abierta: !o.postulada,
conMarcas: !!(o.destacada || o.match),
borde: o.destacada ? '#F0DFA0' : '#ECECEC'
}));
return { chips, ofertas };
}
}
</script>
</body>
</html>
