<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Postulantes sin plan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#333333}
</style>
</helmet>
<div style="width: 390px; height: 890px; box-sizing: border-box; background: #F6F6F6; color: #111111; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; flex-direction: column; padding: 56px 20px 32px 20px; gap: 16px">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <a href="InicioTitular.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 12px; background: #FFFFFF; border: 1px solid #ECECEC; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
    <div style="font-size: 14px; font-weight: 600; color: #6B6B6B">Sin plan</div>
  </div>

  <h1 style="margin: 0; padding: 0 4px; font-family: 'Sora', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.4px; line-height: 1.2">Postulantes</h1>

  <div style="background: #FFFFFF; border: 1px solid #ECECEC; border-radius: 20px; padding: 16px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
      <div style="font-size: 17px; font-weight: 700">Taxi</div>
      <div style="font-size: 13px; line-height: 1.4; color: #6B6B6B">Retiro en [comuna] · Día · Lu a Sá</div>
    </div>
    <span style="display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; font-size: 12px; font-weight: 700; border-radius: 8px; padding: 5px 9px; background: #E3F4EA; color: #145F3B"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 3px; background: #17784A"></span>En la bolsa</span>
  </div>

  <div style="margin-top: 8px; display: flex; align-items: center; gap: 14px; padding: 0 4px">
    <div aria-hidden="true" style="width: 56px; height: 56px; border-radius: 18px; background: #111111; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F5B400" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.9-3.4 3.4-5.2 6.5-5.2s5.6 1.8 6.5 5.2"></path><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8"></path><path d="M18.5 14.9c1.6.8 2.6 2.5 3 5.1"></path></svg></div>
    <h2 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.2px; line-height: 1.3">[N] conductores postularon a tu oferta</h2>
  </div>

  <div aria-hidden="true" style="display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{ ocultos }}" as="o" hint-placeholder-count="5">
      <div style="background: #FFFFFF; border: 1px solid #ECECEC; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; opacity: {{ o.opacidad }}">
        <div style="width: 44px; height: 44px; border-radius: 22px; background: #F0F0F0; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; flex-shrink: 0"><svg width="44" height="44" viewBox="0 0 24 24" fill="#D6D6D6" stroke="none"><circle cx="12" cy="10" r="4.6"></circle><path d="M2.5 26c.9-6 4.6-9.2 9.5-9.2s8.6 3.2 9.5 9.2z"></path></svg></div>
        <div style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1; min-width: 0">
          <div style="height: 10px; width: {{ o.ancho1 }}; border-radius: 5px; background: #E4E4E4"></div>
          <div style="height: 8px; width: {{ o.ancho2 }}; border-radius: 4px; background: #EFEFEF"></div>
        </div>
        <div style="width: 36px; height: 36px; border-radius: 10px; background: #F6F6F6; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0"></path></svg></div>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: auto; padding-top: 8px; display: flex; flex-direction: column; gap: 14px">
    <p style="margin: 0; text-align: center; font-size: 15px; line-height: 1.5; color: #3D3D3D; text-wrap: balance">Elige un plan para ver sus fichas y escribirles.</p>
    <a href="BolsaPlanes.dc.html" style="text-decoration: none; min-height: 56px; border-radius: 16px; background: #F5B400; color: #111111; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">Ver planes</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":890}}'>
class Component extends DCLogic {
renderVals() {
const ocultos = [
{ ancho1: '58%', ancho2: '82%', opacidad: '1' },
{ ancho1: '46%', ancho2: '74%', opacidad: '0.9' },
{ ancho1: '62%', ancho2: '68%', opacidad: '0.78' },
{ ancho1: '50%', ancho2: '80%', opacidad: '0.64' },
{ ancho1: '40%', ancho2: '70%', opacidad: '0.5' },
];
return { ocultos };
}
}
</script>
</body>
</html>
