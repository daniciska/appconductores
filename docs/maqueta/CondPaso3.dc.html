<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Paso 3 · Tu experiencia</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#333333}
</style>
</helmet>
<div style="width: 390px; min-height: 1080px; box-sizing: border-box; background: #F6F6F6; color: #111111; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; flex-direction: column; padding: 56px 20px 32px 20px; gap: 16px">
  <div style="display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="CondPaso2.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 12px; background: #FFFFFF; border: 1px solid #ECECEC; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
      <div style="font-size: 14px; font-weight: 600; color: #6B6B6B">Paso 3 de 5</div>
    </div>
    <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
      <div style="height: 4px; border-radius: 2px; background: #111111"></div>
      <div style="height: 4px; border-radius: 2px; background: #111111"></div>
      <div style="height: 4px; border-radius: 2px; background: #111111"></div>
      <div style="height: 4px; border-radius: 2px; background: #DDDDDD"></div>
      <div style="height: 4px; border-radius: 2px; background: #DDDDDD"></div>
    </div>
  </div>

  <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.4px; line-height: 1.2">Tu experiencia</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #6B6B6B; text-wrap: balance">Marca los vehículos que has manejado y cuántos años llevas manejando cada uno.</p>
  </div>

  <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div id="exp-titulo" style="font-size: 14px; font-weight: 700">¿Qué vehículos has manejado?</div>
      <div style="font-size: 13px; color: #6B6B6B">Según su tamaño. Puedes marcar varios.</div>
    </div>
    <div role="group" aria-labelledby="exp-titulo" style="background: #FFFFFF; border: 1px solid #ECECEC; border-radius: 20px; padding: 12px 14px 14px 14px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: flex-end">
        <div style="width: 132px; text-align: center; font-size: 12px; font-weight: 700; line-height: 1.3; color: #6B6B6B">Años de experiencia</div>
      </div>
      <sc-for list="{{ visibles }}" as="v" hint-placeholder-count="7">
        <div style="display: flex; align-items: center; gap: 10px">
          <button type="button" role="checkbox" aria-checked="{{ v.marcado }}" onClick="{{ v.alternar }}" style="font: inherit; flex-grow: 1; min-width: 0; min-height: 52px; border-radius: 26px; padding: 7px 14px; display: flex; align-items: center; gap: 8px; text-align: left; font-size: 15px; line-height: 1.25; font-weight: {{ v.peso }}; background: {{ v.pillFondo }}; color: {{ v.pillTexto }}; border: {{ v.pillBorde }}">
            <sc-if value="{{ v.sel }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="m5 12 5 5 9-10"></path></svg></sc-if>
            <span style="min-width: 0; display: flex; flex-direction: column; gap: 1px"><span>{{ v.nombre }}</span><span style="font-size: 12px; font-weight: 500; color: {{ v.ejColor }}">{{ v.ejemplo }}</span></span>
          </button>
          <div style="width: 132px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between">
            <button type="button" aria-label="Restar un año: {{ v.nombre }}" aria-disabled="{{ v.inactivo }}" onClick="{{ v.menos }}" style="width: 44px; height: 44px; padding: 0; border-radius: 12px; border: {{ v.btnBorde }}; background: {{ v.btnFondo }}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{ v.icono }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
            <div aria-live="polite" style="width: 36px; text-align: center; font-size: 17px; font-weight: 700; color: {{ v.numColor }}">{{ v.anios }}</div>
            <button type="button" aria-label="Sumar un año: {{ v.nombre }}" aria-disabled="{{ v.inactivo }}" onClick="{{ v.mas }}" style="width: 44px; height: 44px; padding: 0; border-radius: 12px; border: {{ v.btnBorde }}; background: {{ v.btnFondo }}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{ v.icono }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></button>
          </div>
        </div>
      </sc-for>
    </div>
    <sc-if value="{{ hayMas }}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{ verTodos }}" style="font: inherit; align-self: flex-start; min-height: 44px; border: 0; background: transparent; padding: 0 4px; display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; color: #111111">Ver los {{ total }} tipos de vehículo<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
    </sc-if>
  </div>

  <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div id="idiomas-titulo" style="font-size: 14px; font-weight: 700">Idiomas que hablas <span style="font-weight: 500; color: #6B6B6B">(opcional)</span></div>
      <div style="font-size: 13px; color: #6B6B6B">Los titulares lo ven en tu ficha.</div>
    </div>
    <div role="group" aria-labelledby="idiomas-titulo" style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{ idiomas }}" as="i" hint-placeholder-count="5">
        <button type="button" role="checkbox" aria-checked="{{ i.marcado }}" onClick="{{ i.alternar }}" style="font: inherit; min-height: 44px; padding: 0 16px; border-radius: 22px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: {{ i.peso }}; background: {{ i.fondo }}; color: {{ i.texto }}; border: {{ i.borde }}">
          <sc-if value="{{ i.sel }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></sc-if>
          {{ i.nombre }}
        </button>
      </sc-for>
    </div>
  </div>

  <a href="CondPaso4.dc.html" style="margin-top: auto; text-decoration: none; min-height: 56px; border-radius: 16px; background: #111111; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">Continuar</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1080}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { sel: { liviano: true, van: true }, anios: { liviano: 5, van: 2 }, todos: false, idiomas: { es: true } };
}
renderVals() {
const st = this.state;
const tipos = [
['moto', 'Moto', 'moto, scooter'],
['liviano', 'Vehículo liviano', 'auto, SUV, camioneta'],
['van', 'Van o minibús', 'van, furgón, minibús'],
['bus', 'Bus', 'bus o micro'],
['camion', 'Camión', '3/4, camión simple, grúa de autos'],
['articulado', 'Camión articulado', 'tracto con rampla'],
['maquinaria', 'Maquinaria', 'grúa horquilla, retroexcavadora']
];
const MAX = 7;
const anios = (id) => st.anios[id] || 0;
const fijar = (id, n) => this.setState({ anios: { ...st.anios, [id]: Math.max(0, Math.min(50, n)) } });
const lista = tipos.map(([id, nombre, ejemplo]) => {
const sel = !!st.sel[id];
return {
nombre, ejemplo, sel,
ejColor: sel ? '#BDBDBD' : '#6B6B6B',
marcado: sel ? 'true' : 'false',
inactivo: sel ? 'false' : 'true',
peso: sel ? '600' : '500',
pillFondo: sel ? '#111111' : '#FFFFFF',
pillTexto: sel ? '#FFFFFF' : '#111111',
pillBorde: sel ? '1px solid #111111' : '1px solid #DDDDDD',
btnFondo: sel ? '#F6F6F6' : '#FAFAFA',
btnBorde: sel ? '1px solid #DDDDDD' : '1px solid #F0F0F0',
icono: sel ? '#111111' : '#CFCFCF',
numColor: sel ? '#111111' : '#CFCFCF',
anios: anios(id),
alternar: () => this.setState({ sel: { ...st.sel, [id]: !sel } }),
menos: () => { if (sel) fijar(id, anios(id) - 1); },
mas: () => { if (sel) fijar(id, anios(id) + 1); }
};
});
const idiomas = [['es', 'Español'], ['en', 'Inglés'], ['pt', 'Portugués'], ['fr', 'Francés'], ['ht', 'Criollo haitiano']].map(([id, nombre]) => {
const sel = !!st.idiomas[id];
return {
nombre, sel,
marcado: sel ? 'true' : 'false',
peso: sel ? '600' : '500',
fondo: sel ? '#111111' : '#FFFFFF',
texto: sel ? '#FFFFFF' : '#111111',
borde: sel ? '1px solid #111111' : '1px solid #DDDDDD',
alternar: () => this.setState({ idiomas: { ...st.idiomas, [id]: !sel } })
};
});
return {
idiomas,
visibles: st.todos ? lista : lista.slice(0, MAX),
hayMas: !st.todos && tipos.length > MAX,
total: tipos.length,
verTodos: () => this.setState({ todos: true })
};
}
}
</script>
</body>
</html>
