<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mis matches</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#333333}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #F6F6F6; color: #111111; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; flex-direction: column; padding: 56px 20px 0 20px; gap: 16px">
  <h1 style="margin: 0; padding: 0 4px; font-family: 'Sora', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.4px; line-height: 1.2">Mis matches</h1>

  <div role="tablist" aria-label="Filtrar matches" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #EAEAEA; border-radius: 14px; padding: 4px">
    <button type="button" role="tab" aria-selected="true" style="font: inherit; font-size: 14px; font-weight: 700; min-height: 40px; border: 0; border-radius: 10px; background: #FFFFFF; color: #111111">Todos · 3</button>
    <button type="button" role="tab" aria-selected="false" style="font: inherit; font-size: 14px; font-weight: 600; min-height: 40px; border: 0; border-radius: 10px; background: transparent; color: #6B6B6B">Favoritos · 1</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{ matches }}" as="m" hint-placeholder-count="3">
      <div style="background: #FFFFFF; border: 1px solid #ECECEC; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
            <div style="font-size: 17px; font-weight: 700; min-width: 0">{{ m.vehiculo }}</div>
            <sc-if value="{{ m.fav }}" hint-placeholder-val="{{ false }}">
              <button type="button" aria-label="Quitar de favoritos" style="width: 44px; height: 44px; margin: -12px -6px -12px 0; border: 0; border-radius: 12px; background: #FFF6D6; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="#F5B400" stroke="#B88500" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"></path></svg></button>
            </sc-if>
            <sc-if value="{{ m.noFav }}" hint-placeholder-val="{{ true }}">
              <button type="button" aria-label="Marcar como favorito" style="width: 44px; height: 44px; margin: -12px -6px -12px 0; border: 0; border-radius: 12px; background: #F6F6F6; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"></path></svg></button>
            </sc-if>
          </div>
          <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px">
            <div style="font-size: 14px; font-weight: 600; color: #3D3D3D">{{ m.titular }}</div>
            <span style="display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; border-radius: 8px; padding: 5px 9px; background: #E3F4EA; color: #145F3B"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#17784A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Revisado</span>
          </div>
          <div style="font-size: 13px; line-height: 1.4; color: #6B6B6B">{{ m.cond }}</div>
        </div>
        <div style="height: 1px; background: #F0F0F0"></div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
          <sc-if value="{{ m.compartido }}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #145F3B">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#17784A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 7.6-1.7"></path></svg>Te compartió su contacto</div>
          </sc-if>
          <sc-if value="{{ m.oculto }}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #6B6B6B">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0"></path></svg>Contacto oculto</div>
          </sc-if>
          <a href="CondDetalleMatch.dc.html" style="text-decoration: none; min-height: 44px; padding: 0 18px; border-radius: 12px; background: #111111; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 4px; flex-shrink: 0">Ver<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: auto; margin-left: -20px; margin-right: -20px; background: #FFFFFF; border-top: 1px solid #ECECEC; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 0 28px 0">
    <a href="CondInicioActivo.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; font-size: 12px; font-weight: 500; color: #6B6B6B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"></path><path d="M5 10v10h14V10"></path></svg>Inicio</a>
    <a href="CondMatches.dc.html" aria-current="page" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; font-size: 12px; font-weight: 700; color: #111111"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 12l3 3 7-7"></path><circle cx="12" cy="12" r="9"></circle></svg>Matches</a>
    <a href="CondMensajes.dc.html" aria-label="Mensajes, 1 nuevo" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; font-size: 12px; font-weight: 500; color: #6B6B6B"><span style="position: relative; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg><span aria-hidden="true" style="position: absolute; top: -2px; right: -4px; width: 8px; height: 8px; border-radius: 6px; background: #F5B400; border: 2px solid #FFFFFF"></span></span>Mensajes</a>
    <a href="CondPerfil.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; font-size: 12px; font-weight: 500; color: #6B6B6B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Perfil</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const base = { titular: '[Nombre del titular o empresa]' };
const matches = [
{ ...base, vehiculo: 'Taxi', cond: 'Retiro en [comuna] · Día · Lu a Sá', fav: true, compartido: true },
{ ...base, vehiculo: 'Taxi ejecutivo', cond: 'Retiro en [comuna] · Noche · Lu a Vi', fav: false, compartido: false },
{ ...base, vehiculo: 'Taxi', cond: 'Retiro en [comuna] · Día y noche · Todos los días', fav: false, compartido: false },
].map((m) => ({ ...m, noFav: !m.fav, oculto: !m.compartido }));
return { matches };
}
}
</script>
</body>
</html>
