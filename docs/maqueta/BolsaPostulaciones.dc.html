<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mis postulaciones</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#333333}
</style>
</helmet>
<div style="width: 390px; height: 1152px; box-sizing: border-box; background: #F6F6F6; color: #111111; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; flex-direction: column; padding: 56px 20px 0 20px; gap: 16px">
  <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px">
    <h1 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.4px; line-height: 1.2">Bolsa de trabajo</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #6B6B6B; text-wrap: balance">Ofertas abiertas a tu perfil. Postula con un toque.</p>
  </div>

  <div role="tablist" aria-label="Bolsa de trabajo" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #EAEAEA; border-radius: 14px; padding: 4px">
    <a href="BolsaLista.dc.html" role="tab" aria-selected="false" style="text-decoration: none; font-size: 14px; font-weight: 600; min-height: 44px; border-radius: 10px; background: transparent; color: #616161; display: flex; align-items: center; justify-content: center">Ofertas · 5</a>
    <button type="button" role="tab" aria-selected="true" style="font: inherit; font-size: 14px; font-weight: 700; min-height: 44px; border: 0; border-radius: 10px; background: #FFFFFF; color: #111111">Mis postulaciones · 4</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{ postulaciones }}" as="p" hint-placeholder-count="4">
      <div style="background: {{ p.fondo }}; border: 1px solid #ECECEC; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="font-size: 17px; font-weight: 700; color: {{ p.tituloColor }}">{{ p.negocio }}</div>
          <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px">
            <div style="font-size: 14px; font-weight: 600; color: {{ p.subColor }}">{{ p.titular }}</div>
            <span style="display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; border-radius: 8px; padding: 5px 9px; background: {{ p.revBg }}; color: {{ p.revColor }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{ p.revIcono }}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Revisado</span>
          </div>
          <div style="font-size: 13px; line-height: 1.4; color: #6B6B6B">{{ p.cond }}</div>
        </div>
        <div style="height: 1px; background: #ECECEC"></div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px">
          <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; border-radius: 8px; padding: 6px 10px; background: {{ p.pillBg }}; color: {{ p.pillColor }}">
            <sc-if value="{{ p.esEscribio }}" hint-placeholder-val="{{ true }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#17784A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg></sc-if>
            <sc-if value="{{ p.esVista }}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3D3D3D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></sc-if>
            <sc-if value="{{ p.esEnviada }}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3D3D3D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3 10 14"></path><path d="M21 3l-7 18-4-7-7-4z"></path></svg></sc-if>
            <sc-if value="{{ p.esCerrada }}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m5.6 5.6 12.8 12.8"></path></svg></sc-if>
            {{ p.estado }}</span>
          <sc-if value="{{ p.esEscribio }}" hint-placeholder-val="{{ true }}">
            <a href="CondConversacion.dc.html" style="text-decoration: none; min-height: 44px; padding: 0 16px; border-radius: 12px; background: #111111; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 4px; flex-shrink: 0">Ver mensajes<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
          </sc-if>
          <sc-if value="{{ p.sinAccion }}" hint-placeholder-val="{{ false }}">
            <div style="font-size: 13px; color: #6B6B6B; flex-shrink: 0">{{ p.fecha }}</div>
          </sc-if>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; background: #EEEEEE; border-radius: 14px; padding: 14px 16px">
    <div style="width: 36px; height: 36px; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg></div>
    <div style="font-size: 13px; line-height: 1.45; color: #3D3D3D">Si el titular te escribe, la conversación aparece en Mensajes.</div>
  </div>

  <div style="margin-top: auto; margin-left: -20px; margin-right: -20px; background: #FFFFFF; border-top: 1px solid #ECECEC; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 0 28px 0">
    <a href="CondInicioActivo.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; font-size: 12px; font-weight: 500; color: #6B6B6B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"></path><path d="M5 10v10h14V10"></path></svg>Inicio</a>
    <a href="CondMatches.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; font-size: 12px; font-weight: 500; color: #6B6B6B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 12l3 3 7-7"></path><circle cx="12" cy="12" r="9"></circle></svg>Matches</a>
    <a href="BolsaLista.dc.html" aria-current="page" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; font-size: 12px; font-weight: 700; color: #111111"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"></path><path d="M3 12.5h18"></path></svg>Bolsa</a>
    <a href="CondMensajes.dc.html" aria-label="Mensajes, 1 nuevo" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; font-size: 12px; font-weight: 500; color: #6B6B6B"><span style="position: relative; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg><span aria-hidden="true" style="position: absolute; top: -2px; right: -4px; width: 8px; height: 8px; border-radius: 6px; background: #F5B400; border: 2px solid #FFFFFF"></span></span>Mensajes</a>
    <a href="CondPerfil.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; font-size: 12px; font-weight: 500; color: #6B6B6B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Perfil</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1152}}'>
class Component extends DCLogic {
renderVals() {
const base = { titular: '[Nombre del titular o empresa]' };
const estilos = {
escribio: { estado: 'Te escribió', pillBg: '#E3F4EA', pillColor: '#145F3B' },
vista: { estado: 'Vista por el titular', pillBg: '#F0F0F0', pillColor: '#3D3D3D' },
enviada: { estado: 'Enviada', pillBg: '#F0F0F0', pillColor: '#3D3D3D' },
cerrada: { estado: 'Cerrada', pillBg: '#ECECEC', pillColor: '#6B6B6B' }
};
const postulaciones = [
{ ...base, tipo: 'escribio', negocio: 'Taxi ejecutivo', cond: 'Retiro en [comuna] · Noche · Lu a Vi', fecha: '[dd/mm]' },
{ ...base, tipo: 'vista', negocio: 'Taxi', cond: 'Retiro en [comuna] · Noche · Lu a Sá', fecha: '[dd/mm]' },
{ ...base, tipo: 'enviada', negocio: 'Taxi', cond: 'Retiro en [comuna] · Día y noche · Todos los días', fecha: '[dd/mm]' },
{ ...base, tipo: 'cerrada', negocio: 'Taxi ejecutivo', cond: 'Retiro en [comuna] · Día · Lu a Sá', fecha: '[dd/mm]' }
].map((p) => {
const cerrada = p.tipo === 'cerrada';
return {
...p,
...estilos[p.tipo],
esEscribio: p.tipo === 'escribio',
esVista: p.tipo === 'vista',
esEnviada: p.tipo === 'enviada',
esCerrada: cerrada,
sinAccion: p.tipo !== 'escribio',
fondo: cerrada ? '#F6F6F6' : '#FFFFFF',
tituloColor: cerrada ? '#6B6B6B' : '#111111',
subColor: cerrada ? '#6B6B6B' : '#3D3D3D',
revBg: cerrada ? '#ECECEC' : '#E3F4EA',
revColor: cerrada ? '#6B6B6B' : '#145F3B',
revIcono: cerrada ? '#6B6B6B' : '#17784A'
};
});
return { postulaciones };
}
}
</script>
</body>
</html>
