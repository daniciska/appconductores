<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dale Contacto" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #ececec;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        overflow: hidden;
        margin: 0;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      input,
      textarea {
        outline: none;
      }
      /* iPhone y iPad: Safari agranda la página al tocar un campo con letra de menos de 16 px. Solo ahí
         (la regla no aplica en otros navegadores), los campos usan 16 px; el zoom con los dedos sigue. */
      @supports (-webkit-touch-callout: none) {
        input,
        textarea,
        select {
          font-size: 16px !important;
        }
      }
      ::selection {
        background: #f5b400;
        color: #111111;
      }
    </style>
  </head>
  <body>
    <noscript>Activa JavaScript para usar Dale Contacto.</noscript>
    <div id="root"></div>
  </body>
</html>
